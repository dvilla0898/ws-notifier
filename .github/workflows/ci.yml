# Integración continua: se ejecuta en cada push a master y en cada Pull Request.
# Si algún paso falla, el PR queda marcado en rojo (y, con la protección de rama
# activada, no se puede hacer merge). El despliegue NO ocurre aquí: lo hace Vercel.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Si subes otro commit al mismo PR, cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, tests y build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar pnpm (versión del campo "packageManager" de package.json)
        uses: pnpm/action-setup@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Con pnpm-lock.yaml en el repo, instala exactamente las versiones bloqueadas.
      # Mientras no exista el lockfile, lo genera (ver README: "Primer arranque").
      - name: Instalar dependencias
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
